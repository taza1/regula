name: Research system
on:
  pull_request:
    paths: ['research_system/**', '.github/workflows/research-system.yml']
  push:
    paths: ['research_system/**', '.github/workflows/research-system.yml']
permissions:
  contents: read
jobs:
  local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research_system
    env:
      MODEL_PROVIDER: mock
      SOURCE_CONNECTOR: local
      LOCAL_DB_PATH: data/ci.db
      RESEARCH_BASE_URL: http://127.0.0.1:8012
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: research_system/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python -m pytest tests -q --junitxml=test-results/python.xml
      - name: Browser checks against a managed local server
        run: |
          python -m uvicorn src.main:app --host 127.0.0.1 --port 8012 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$RESEARCH_BASE_URL/health"; then break; fi
            sleep 1
          done
          curl --fail --silent "$RESEARCH_BASE_URL/health"
          npm run test:e2e
